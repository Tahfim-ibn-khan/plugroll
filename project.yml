name: Plugroll
options:
  bundleIdPrefix: com.tahfim
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Swift 6's data-race checks, as warnings, while the code is still Swift 5.
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Plugroll:
    type: application
    platform: iOS
    sources:
      - path: Plugroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahfim.vimagereader
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MWNZDA9UKF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Plugroll
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Plugroll saves photos and videos you pick from your drive to your photo library."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      configs:
        Release:
          # Strips symbols from the binary even for a plain `build` (as CI does),
          # which more than halves it. The dSYM next to the app keeps them.
          DEPLOYMENT_POSTPROCESSING: "YES"
          STRIP_INSTALLED_PRODUCT: "YES"
          STRIP_STYLE: all
  PlugrollTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlugrollTests
    dependencies:
      - target: Plugroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahfim.vimagereader.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MWNZDA9UKF
schemes:
  Plugroll:
    build:
      targets:
        Plugroll: all
        PlugrollTests: [test]
    test:
      targets:
        - PlugrollTests
