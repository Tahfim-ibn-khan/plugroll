name: VimageReader
options:
  bundleIdPrefix: com.tahfim
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VimageReader:
    type: application
    platform: iOS
    sources:
      - path: VimageReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tahfim.vimagereader
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: MWNZDA9UKF
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: vimage
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "vimage saves photos and videos you pick from your drive to your photo library."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
