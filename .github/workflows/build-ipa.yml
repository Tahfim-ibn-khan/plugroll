name: Build unsigned IPA

# Builds the app on GitHub's Macs so it does not have to be built here, and
# publishes an unsigned .ipa. SideStore (or AltStore) signs it on the phone with
# your own Apple ID, so no signing certificate is ever needed in CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the release job, which runs no build tools, can write.
permissions:
  contents: read

# A newer push replaces a build still in progress, so two runs never race on the release.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"

jobs:
  build:
    runs-on: macos-15

    steps:
      # Actions are pinned to commits: a moved tag can't change what runs here.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install XcodeGen (pinned, checksum verified)
        run: |
          curl -fsSL -o xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: |
          # Whichever iPhone simulator this runner has; names change between images.
          udid=$(xcrun simctl list devices available | grep -m1 -E '^[[:space:]]+iPhone' | grep -oE '[0-9A-F-]{36}')
          xcodebuild test \
            -project Plugroll.xcodeproj \
            -scheme Plugroll \
            -destination "id=$udid" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for device, unsigned
        run: |
          xcodebuild \
            -project Plugroll.xcodeproj \
            -target Plugroll \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package as .ipa
        run: |
          mkdir -p Payload
          cp -R build/Plugroll.app Payload/Plugroll.app
          zip -qry Plugroll.ipa Payload
          shasum -a 256 Plugroll.ipa > Plugroll.ipa.sha256
          ls -lh Plugroll.ipa
          cat Plugroll.ipa.sha256

      - name: Upload as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Plugroll-ipa
          path: |
            Plugroll.ipa
            Plugroll.ipa.sha256
          if-no-files-found: error

  # One rolling release, so the download link on the phone never changes.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Plugroll-ipa

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NOTES: "Unsigned build of ${{ github.sha }}. Install with SideStore or AltStore; they sign it with your Apple ID."
        run: |
          # Replace the files in place instead of deleting the release, so the
          # download link never disappears mid-update.
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Latest build" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload latest Plugroll.ipa Plugroll.ipa.sha256 --clobber
          gh release edit latest --notes "$NOTES
          SHA-256: $(cut -d' ' -f1 Plugroll.ipa.sha256)"
          # Move the tag to this commit so the release points at what was built.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
